name: monitor

# Continuous production verification.
#
# The deploy gate proves a release works at the moment it ships. Nothing was
# watching between deploys -- which is how Redis stayed unreachable for months
# while trending silently returned empty reports and every analysis billed at
# the cache-miss rate. Fly's health checks did not catch it because a Redis
# outage is deliberately "degraded", not "down": the instance keeps serving and
# stays in rotation.
#
# A failing run here is the alert. GitHub notifies on workflow failure.

on:
  schedule:
    # Every 15 minutes. Cron on GitHub is best-effort and can be delayed under
    # load, which is fine -- this is a safety net, not a pager SLA.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checked before the smoke suite because it is the cheap, specific signal.
      # "degraded" means a dependency is down while the app still serves -- the
      # exact state that went unnoticed for months.
      - name: Check readiness
        id: readiness
        run: |
          BODY=$(curl -s --max-time 15 https://lowendinsight.dev/readyz)
          echo "readyz: $BODY"

          STATUS=$(echo "$BODY" | jq -r '.status // "unreachable"')

          case "$STATUS" in
            ok)
              echo "All dependencies healthy."
              ;;
            degraded)
              FAILING=$(echo "$BODY" | jq -r '.checks | to_entries[] | select(.value != "ok") | .key' | paste -sd, -)
              echo "::error::Production is DEGRADED. Failing dependencies: ${FAILING}. The app is still serving, which is why nothing else will tell you."
              exit 1
              ;;
            *)
              echo "::error::Production readiness is '${STATUS}'. Response: ${BODY}"
              exit 1
              ;;
          esac

      # Readiness already fails on a stuck or backed-up queue (it is an
      # optional check, so it reads as "degraded"). This prints the numbers
      # behind that verdict, and fails if the queue could not be read at all.
      - name: Report queue depth
        id: queue
        run: |
          METRICS=$(curl -s --max-time 15 https://lowendinsight.dev/metrics | grep '^lei_queue' || true)
          echo "${METRICS:-no lei_queue metrics}"

          if [ -z "$METRICS" ]; then
            echo "::error::/metrics reported no queue gauges: the queue collector is not running."
            exit 1
          fi

          if echo "$METRICS" | grep -q '^lei_queue_error 1'; then
            echo "::error::The queue could not be read. Background work cannot be confirmed to be running."
            exit 1
          fi

      # A wrong STRIPE_WEBHOOK_SECRET fails exactly like an unset one: every
      # delivery 400s, subscriptions quietly stop activating, and nothing else
      # changes. That state already went unnoticed once in this project.
      #
      # Rolling a signing secret is the usual cause -- Stripe keeps the old one
      # valid for up to 24 hours, so the failure appears a day after the change
      # that caused it, by which point nobody connects the two.
      # Trending is parked (#206). Its freshness check lived here; nothing
      # refreshes those reports now, so it would warn every 15 minutes
      # forever -- which is how a monitor stops being read.

      - name: Check Stripe webhook verification
        id: webhooks
        run: |
          METRICS=$(curl -s --max-time 15 https://lowendinsight.dev/metrics)

          if ! echo "$METRICS" | grep -q "lei_stripe_webhook_total"; then
            echo "::warning::No webhook metrics exposed. Deployed release predates them."
            exit 0
          fi

          field() {
            echo "$METRICS" | grep "lei_stripe_webhook_total{result=\"$1\"}" \
              | awk '{print $2}' | tr -d '\r'
          }

          OK=$(field ok); INVALID=$(field invalid)
          UNCONFIGURED=$(field unconfigured); UNSIGNED=$(field unsigned)

          echo "verified: ${OK}  invalid: ${INVALID}  unconfigured: ${UNCONFIGURED}  unsigned: ${UNSIGNED}"

          # "unsigned" is scanners hitting a public URL. Deliberately not an error.
          FAILED=0

          if [ "${UNCONFIGURED:-0}" -gt 0 ]; then
            echo "::error::Stripe signed ${UNCONFIGURED} webhook(s) but STRIPE_WEBHOOK_SECRET is unset on the running app. Set it with: flyctl secrets import -a lowendinsight"
            FAILED=1
          fi

          if [ "${INVALID:-0}" -gt 0 ]; then
            echo "::error::${INVALID} Stripe webhook(s) failed signature verification. The secret is set but does not match the sending endpoint — usually a rolled secret that was not copied to Fly, or copied from a different endpoint. See docs/BILLING_SETUP.md."
            FAILED=1
          fi

          exit $FAILED

      # The ledger exists so a discrepancy is visible. Checked here rather
      # than in a dashboard, for the same reason as everything else in this
      # file: a dashboard nobody opens is not monitoring.
      #
      # Drift means recorded usage and debited credits disagree. Since #112
      # they commit in one transaction, so any non-zero value is a real fault
      # rather than an expected gap.
      - name: Check credit ledger reconciliation
        id: ledger
        run: |
          METRICS=$(curl -s --max-time 15 https://lowendinsight.dev/metrics)

          if ! echo "$METRICS" | grep -q "lei_credit_reconciliation"; then
            echo "::warning::No reconciliation metrics exposed. Deployed release predates them."
            exit 0
          fi

          measure() {
            echo "$METRICS" | grep "lei_credit_reconciliation{measure=\"$1\"}" \
              | awk '{print $2}' | tr -d '\r'
          }

          DRIFTING=$(measure drifting_rows)
          DRIFT=$(measure drift_credits)
          RECONCILED=$(measure reconciled_rows)
          PRE_LEDGER=$(measure pre_ledger_rows)
          ERRORED=$(measure error)

          echo "reconciled: ${RECONCILED}  drifting: ${DRIFTING}  drift: ${DRIFT} credits  pre-ledger: ${PRE_LEDGER}"

          if [ -n "${ERRORED:-}" ]; then
            echo "::error::Reconciliation could not be computed. The check is not reporting clean, it is not reporting."
            exit 1
          fi

          if [ "${DRIFTING:-0}" -gt 0 ]; then
            echo "::error::${DRIFTING} usage row(s) disagree with the ledger by ${DRIFT} credits (\$$(awk "BEGIN{printf \"%.3f\", ${DRIFT}/1000}")). Investigate with Lei.Reconciliation.drifting_rows/0."
            exit 1
          fi

          echo "Ledger agrees with recorded usage."

          if ! echo "$METRICS" | grep -q "lei_stripe_metering"; then
            echo "::warning::No metering metrics exposed. Deployed release predates them."
            exit 0
          fi

          meter() {
            echo "$METRICS" | grep "lei_stripe_metering{measure=\"$1\"}" \
              | awk '{print $2}' | tr -d '\r'
          }

          FAILED_METER=$(meter failed)
          UNREPORTED=$(meter unreported)
          UNREPORTED_CREDITS=$(meter unreported_credits)

          echo "metering — reported: $(meter reported)  failed: ${FAILED_METER}  unreported: ${UNREPORTED}"

          # Both mean usage was consumed and Stripe was not told, which is
          # under-billing. They need different responses: "failed" we know
          # about and can replay, "unreported" means the call was never made
          # or the process died before it returned.
          if [ "${FAILED_METER:-0}" -gt 0 ] || [ "${UNREPORTED:-0}" -gt 0 ]; then
            echo "::error::${FAILED_METER} failed and ${UNREPORTED} unreported meter events, worth ${UNREPORTED_CREDITS} credits of unbilled usage."
            exit 1
          fi

      # Everything above watches the service. This watches the money.
      #
      # Stage F built these signals over two days (#213, #215, #216, #208) and
      # nothing read them: the counters were on /metrics and the only thing
      # that would have noticed a discrepancy was someone running
      # scripts/payments.sh by hand. That is the shape this repository keeps
      # meeting, one layer further out -- the check existed and reported
      # correctly, and no one was on the other end.
      - name: Check payment rails and the Stripe ledger
        id: payments
        run: |
          METRICS=$(curl -s --max-time 15 https://lowendinsight.dev/metrics)

          if [ -z "$METRICS" ]; then
            echo "::error::/metrics returned nothing. No payment signal could be read at all."
            exit 1
          fi

          gauge() {
            echo "$METRICS" | grep -F "$1" | awk '{print $2}' | tr -d '\r' | head -1
          }

          FAILED=0

          # A gauge family that vanished is not an all-clear.
          #
          # Every check below reads its number out of this one response with
          # grep, and grep finding nothing looks exactly like a rail reporting
          # zero: the switch check goes quiet, the held check reads 0, the
          # unmatched-reversal check reads 0. A collector that stopped being
          # registered, or a metric renamed in a refactor, would turn this
          # whole step green. So the families are asserted present before
          # anything reads a value out of them.
          for family in lei_payment_switch_enabled lei_payment_held \
                        lei_stripe_reversal_events_total lei_payment_outcomes \
                        lei_unqueued_credits; do
            if ! echo "$METRICS" | grep -q "^${family}"; then
              echo "::error::/metrics is not publishing ${family}. The check that reads it cannot run, and an absent counter reads exactly like a clean one."
              FAILED=1
            fi
          done

          # -- ledger against Stripe (#216)
          #
          # Absent means the release predates the hourly job, not that it is
          # clean; that is an error rather than a pass, because "no answer"
          # and "no discrepancies" are the two things that must never look
          # alike here.
          if ! echo "$METRICS" | grep -q "lei_stripe_reconciliation"; then
            echo "::error::No Stripe reconciliation metrics. The ledger is not being compared with Stripe."
            exit 1
          fi

          if [ -n "$(gauge 'lei_stripe_reconciliation{measure="error"}')" ]; then
            echo "::error::Stripe reconciliation could not be computed. It is not reporting clean, it is not reporting."
            FAILED=1
          fi

          RECON_FAILED=$(gauge 'lei_stripe_reconciliation{measure="failed"}')
          AGE=$(gauge 'lei_stripe_reconciliation{measure="age_seconds"}')
          DISCREPANCIES=$(gauge 'lei_stripe_reconciliation{measure="discrepancies"}')
          PROBES=$(gauge 'lei_stripe_reconciliation{measure="probe_excluded"}')

          echo "reconciliation — age: ${AGE:-unknown}s  discrepancies: ${DISCREPANCIES:-unknown}  probes excluded: ${PROBES:-0}"

          if [ "${RECON_FAILED:-0}" -eq 1 ]; then
            echo "::error::The last Stripe reconciliation run failed. Inspect it with: scripts/payments.sh reconciliation"
            FAILED=1
          fi

          # The job runs hourly. Three hours means it has stopped, and a stale
          # clean result reads exactly like a fresh one on every other gauge.
          if [ -n "${AGE:-}" ] && [ "$AGE" -gt 10800 ]; then
            echo "::error::The last Stripe reconciliation was ${AGE}s ago; the hourly job has stopped. Every figure below it is stale."
            FAILED=1
          fi

          if [ "${DISCREPANCIES:-0}" -gt 0 ]; then
            echo "::error::${DISCREPANCIES} payment(s) disagree between the ledger and Stripe — money received and not credited, or credited and not received. Run: scripts/payments.sh reconciliation"
            FAILED=1
          fi

          # -- refunds and disputes that matched no purchase (#208)
          UNMATCHED=$(gauge 'lei_stripe_reversal_events_total{result="unmatched"}')
          if [ "${UNMATCHED:-0}" -gt 0 ]; then
            echo "::error::${UNMATCHED} refund/dispute event(s) matched no credit purchase. Credits were not taken back for money that was."
            FAILED=1
          fi

          # -- work charged for that never reached the queue (#217)
          #
          # The credits were given back, so no customer is out of pocket -- but
          # something stopped the queue accepting work, and the usual cause is
          # Oban schema drift, which nothing else reports until analyses stop
          # happening. A one-hour window rather than a day: long enough not to
          # vanish before anyone looks, short enough to clear on its own.
          UNQUEUED=$(gauge 'lei_unqueued_credits{window="1h",measure="entries"}')
          UNQUEUED_ALL=$(gauge 'lei_unqueued_credits{window="all",measure="entries"}')
          echo "unqueued — last hour: ${UNQUEUED:-unknown}  all time: ${UNQUEUED_ALL:-unknown}"

          if [ "${UNQUEUED:-0}" -gt 0 ]; then
            echo "::error::${UNQUEUED} request(s) were charged for work that could not be queued in the last hour, and credited back. Check the Oban schema (ObanSchemaVersionTest) and the database."
            FAILED=1
          fi

          # -- rails switched off (#215)
          #
          # A kill switch used during an incident and never switched back is
          # revenue silently declining, and nothing else reports it: a rail
          # that is off refuses cleanly, which looks like no demand.
          OFF=$(echo "$METRICS" | grep '^lei_payment_switch_enabled{' | grep ' 0$' \
            | sed -n 's/^lei_payment_switch_enabled{path="\([^"]*\)"} 0$/\1/p' | paste -sd, -)

          if [ -n "$OFF" ]; then
            echo "::error::Payment path(s) switched off: ${OFF}. If an incident is over, re-enable with: scripts/payments.sh switch-on <path> --reason ..."
            FAILED=1
          fi

          # -- credentials presented and held (#215)
          #
          # A held stablecoin credential is a transfer that already happened on
          # chain against a rail that refused it: the customer has paid and has
          # nothing. These do not resolve on their own.
          HELD=$(echo "$METRICS" | grep '^lei_payment_held{' | awk '{s+=$2} END {print s+0}')
          if [ "${HELD:-0}" -gt 0 ]; then
            echo "::error::${HELD} payment credential(s) held after a refusal. Someone has paid and not been credited. Run: scripts/payments.sh held"
            FAILED=1
          fi

          # -- conversion, reported and not judged
          #
          # Deliberately never fails. Scanners and probes issue challenges that
          # nobody settles, so any threshold here would be noise; the number is
          # printed so a human reading a real alert above has the context.
          echo "$METRICS" | grep '^lei_payment_outcomes{' | grep -v ' 0$' || echo "no payment outcomes in the last 24h"

          exit $FAILED

      # Between deploys, nothing else exercises the journey the site exists
      # for. Not strict here: without an admin key the analysis check can be
      # satisfied by a cached report, and the canary says so rather than
      # quietly reporting a weaker result as a pass.
      # A deploy that declined and shipped nothing produces no failure
      # anywhere: the gate is satisfied, CI is green, and the run concludes
      # success (#259). Production simply stays on an older commit, and every
      # other check here passes, because everything they test is fine.
      #
      # This is the only check that would notice. scripts/ops/deploy-status.sh
      # reads the `Deploy and verify` job rather than the run conclusion, which
      # is the distinction the whole thing turns on.
      - name: Check the tip of main is deployed
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIP=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)

          if [ -z "$TIP" ]; then
            echo "::error::Could not read the tip of main, so whether it is deployed is unknown."
            exit 1
          fi

          # A deploy in flight is a legitimate divergence. CI takes minutes and
          # the deploy takes minutes more, so a commit merged moments ago is
          # expected not to be live yet. Only a tip that has had time to ship
          # and has not is worth waking someone for.
          COMMITTED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .commit.committer.date)
          AGE=$(( $(date -u +%s) - $(date -u -d "$COMMITTED" +%s) ))
          GRACE=$(( 30 * 60 ))

          echo "tip ${TIP:0:7}, committed ${COMMITTED} (${AGE}s ago)"

          set +e
          scripts/ops/deploy-status.sh "$TIP"
          RESULT=$?
          set -e

          case "$RESULT" in
            0)
              echo "The tip of main is live."
              ;;
            1)
              if [ "$AGE" -lt "$GRACE" ]; then
                echo "::notice::${TIP:0:7} is not deployed yet, but was committed ${AGE}s ago; within the ${GRACE}s grace."
              else
                echo "::error::${TIP:0:7} has been the tip of main for ${AGE}s and is not deployed. A deploy run that declines ships nothing and still reports success, so nothing else will tell you."
                exit 1
              fi
              ;;
            *)
              # Consistent with the rest of this workflow: an answer we could
              # not get is not a reassuring one.
              echo "::error::Could not determine whether ${TIP:0:7} is deployed."
              exit 1
              ;;
          esac

      - name: Canary the web UI
        id: canary
        env:
          LEI_ADMIN_API_KEY: ${{ secrets.LEI_ADMIN_API_KEY }}
          # Flipped to "live" at cutover (#141). Until then, a live key is wrong.
          STRIPE_EXPECTED_MODE: ${{ vars.STRIPE_EXPECTED_MODE || 'test' }}
        run: scripts/canary.sh https://lowendinsight.dev

      # Fails when the key is absent, rather than warning and passing.
      #
      # It warned and exited 0 from the day it was added, and the secret was
      # never set -- so this step reported success on every run while executing
      # nothing, and the summary said "Verify production" throughout. That is
      # the failure this whole file exists to catch, inside the file itself.
      #
      # The original reasoning was that failing every 15 minutes until someone
      # sets a secret is alert fatigue. It is: the answer is to set the secret,
      # not to let the check describe work it did not do.
      - name: Smoke test against production
        id: smoke
        env:
          LEI_SMOKE_API_KEY: ${{ secrets.LEI_SMOKE_API_KEY }}
        run: |
          if [ -z "$LEI_SMOKE_API_KEY" ]; then
            echo "::error::LEI_SMOKE_API_KEY is not set, so the smoke suite did not run. Create a dedicated smoke-test org and add its key as a repository secret; signing up on a schedule would otherwise create a real org every 15 minutes."
            exit 1
          fi
          ./scripts/smoke-test.sh https://lowendinsight.dev

      # Paging, once per incident.
      #
      # This file runs every 15 minutes, so paging on the *state* would send 96
      # pages a day for a single outage -- worse than the GitHub email it
      # replaces, because the operator stops reading it. It pages on the
      # transition into failure instead: if the previous completed run of this
      # workflow also failed, the incident is already known and this run stays
      # quiet. Recovery is not paged; the run going green is the signal.
      #
      # Deliberately not added when #225 shipped the deploy and backup pages:
      # the smoke step below was going to fail until LEI_SMOKE_API_KEY existed,
      # and wiring a page to a check known to be red is how an alarm gets
      # ignored on its first day. The key is set and this file has been green
      # since.
      - name: Page on a failed check
        id: page
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          READINESS: ${{ steps.readiness.outcome }}
          QUEUE: ${{ steps.queue.outcome }}
          WEBHOOKS: ${{ steps.webhooks.outcome }}
          LEDGER: ${{ steps.ledger.outcome }}
          PAYMENTS: ${{ steps.payments.outcome }}
          CANARY: ${{ steps.canary.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          DEPLOYED: ${{ steps.deployed.outcome }}
        run: |
          # Which checks failed, by name, so the page says what is wrong rather
          # than that something is.
          FAILED=""
          for pair in "readiness:$READINESS" "queue:$QUEUE" "webhooks:$WEBHOOKS" \
                      "ledger:$LEDGER" "payments:$PAYMENTS" "canary:$CANARY" "smoke:$SMOKE" \
                      "deployed:$DEPLOYED"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            [ "$outcome" = "failure" ] && FAILED="${FAILED}${FAILED:+, }${name}"
          done
          FAILED="${FAILED:-unidentified}"
          echo "failed checks: ${FAILED}"

          # The previous completed run of this workflow, excluding this one.
          # An "unknown" answer pages: a page withheld because a lookup failed
          # is a page that did not happen, and this step exists precisely for
          # the case where nothing else is watching.
          PREVIOUS=$(gh run list --workflow=monitor.yml --status completed \
            --limit 5 --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].conclusion" 2>/dev/null \
            || echo unknown)
          PREVIOUS="${PREVIOUS:-unknown}"
          echo "previous completed run: ${PREVIOUS}"

          if [ "$PREVIOUS" = "failure" ]; then
            echo "Already paged for this incident; staying quiet."
            exit 0
          fi

          # Money and a dead dependency wake someone up. A canary or smoke
          # failure is a broken journey worth looking at now, not at 3am.
          case "$FAILED" in
            *readiness*|*payments*|*ledger*|*webhooks*) PRIORITY=5 ;;
            *) PRIORITY=4 ;;
          esac

          scripts/notify.sh \
            --title "LEI: production check failed" --priority "$PRIORITY" \
            --tags rotating_light --click "$RUN_URL" \
            "Failed: ${FAILED}. Previous run: ${PREVIOUS}. Repeats stay quiet until this clears."
