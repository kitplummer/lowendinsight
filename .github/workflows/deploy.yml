name: deploy

# Deploys main to Fly once umbrella_ci has passed on it, then gates on the smoke
# suite running against the live host. A green build is necessary, not
# sufficient -- answering correctly in production is the gate.
#
# Until 2026-09-16 this ran on push, beside umbrella_ci rather than after it:
# #209 and #210 were live about ten minutes before their CI finished, and that
# CI failed. A failed umbrella_ci run now deploys nothing.
#
# Requires the FLY_API_TOKEN repository secret (`fly tokens create deploy`).
# Without it the job fails fast at the auth check rather than half-deploying.

on:
  workflow_run:
    workflows: [umbrella_ci]
    types: [completed]
    branches: [main]
  # Manual override: deploys the chosen ref without waiting for CI.
  workflow_dispatch:

# Never let two deploys interleave. Cancelling mid-deploy could leave the app
# on a half-released version, so queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Which commit, and whether to deploy it at all.
  gate:
    name: CI passed on the tip of main
    runs-on: ubuntu-latest
    # A push to main that passed. Not the nightly scheduled run, which has
    # nothing new to deploy, and not a failure.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual deploy of ${GITHUB_SHA}; CI is not checked."
            exit 0
          fi

          # Two merges close together finish CI in either order. Deploying the
          # older one after the newer would put production back a version, so
          # only the current tip deploys; the newer commit's own run deploys it.
          TIP=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ -z "$TIP" ]; then
            echo "::error::Could not read the tip of main; not deploying."
            exit 1
          fi
          echo "sha=${RUN_SHA}" >> "$GITHUB_OUTPUT"
          if [ "$RUN_SHA" = "$TIP" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "CI passed on ${RUN_SHA}, the tip of main. Deploying."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI passed on ${RUN_SHA}, but main is now at ${TIP}. Not deploying; that commit's CI run deploys it."
          fi

  deploy:
    name: Deploy and verify
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed, not whatever main is when this job starts.
          ref: ${{ needs.gate.outputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check FLY_API_TOKEN is configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Create one with 'fly tokens create deploy' and add it as a repository secret."
            exit 1
          fi
          flyctl auth whoami

      # Recorded before deploying so a failed smoke test has something to go
      # back to. .Machines[0].config.image is the running image ref.
      - name: Record currently deployed image
        id: current
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          IMAGE=$(flyctl status -a lowendinsight --json | jq -r '.Machines[0].config.image // empty')
          if [ -z "$IMAGE" ]; then
            echo "::warning::Could not determine current image; automatic rollback will be unavailable."
          else
            echo "Current image: $IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      # Fly's own health checks gate promotion, but they only prove the app
      # answers /healthz. The smoke suite is what proves the deployed code
      # actually works -- it is the reason three features previously shipped
      # broken with green CI.
      # LEI_SMOKE_API_KEY keeps the suite from signing up, which would create a
      # real org on every deploy. Falls back to signup when unset.
      - name: Smoke test against production
        id: smoke
        env:
          LEI_SMOKE_API_KEY: ${{ secrets.LEI_SMOKE_API_KEY }}
        run: ./scripts/smoke-test.sh https://lowendinsight.dev

      # The Analyze button hung forever in production while every layer beneath
      # it was green. A deploy that breaks the journey should not ship.
      - name: Canary the web UI
        id: canary
        env:
          LEI_ADMIN_API_KEY: ${{ secrets.LEI_ADMIN_API_KEY }}
          # Flipped to "live" at cutover (#141). Until then, a live key is wrong.
          STRIPE_EXPECTED_MODE: ${{ vars.STRIPE_EXPECTED_MODE || 'test' }}
          CANARY_STRICT: "1"
        run: scripts/canary.sh https://lowendinsight.dev

      - name: Roll back to previous image
        if: failure() && (steps.smoke.outcome == 'failure' || steps.canary.outcome == 'failure') && steps.current.outputs.image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::error::Post-deploy verification failed (smoke: ${{ steps.smoke.outcome }}, canary: ${{ steps.canary.outcome }}). Rolling back to ${{ steps.current.outputs.image }}"
          flyctl deploy --image "${{ steps.current.outputs.image }}" --strategy immediate -a lowendinsight

          # --strategy immediate replaces the machine without waiting for health
          # checks, which is what we want for a rollback -- get the known-good
          # code serving as fast as possible. But it means the app is still
          # booting when this step continues, so wait for it before verifying.
          # Without this the smoke test raced the restart and exited 28 (curl
          # timeout) on its first request, reporting a failed rollback that had
          # actually succeeded.
          echo "Waiting for the rolled-back version to answer /healthz..."
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 https://lowendinsight.dev/healthz >/dev/null 2>&1; then
              echo "Healthy after ${attempt} attempt(s)."
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::Rolled-back version did not become healthy within 150s."
              exit 1
            fi
            sleep 5
          done

          # Deliberately not the full smoke suite. You roll back *because* the
          # new version failed a check -- and when that check covers a bug the
          # old version still has, re-running everything guarantees a failure
          # and reports a successful rollback as a failed one.
          #
          # What matters here is that the previous version is serving again.
          echo "Verifying the previous version is serving:"
          for endpoint in /healthz /readyz /; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://lowendinsight.dev${endpoint}")
            if [ "$CODE" != "200" ]; then
              echo "::error::Rolled-back version returned ${CODE} for ${endpoint}"
              exit 1
            fi
            echo "  ${endpoint} -> ${CODE}"
          done
          echo "Previous version is serving. The deploy that triggered this rollback still needs fixing."

      # Paging, not a notification.
      #
      # A failed deploy produced a red job and a GitHub email, which depends on
      # the recipient's notification settings and arrives in the same place as
      # everything else. The two states that matter most reach nobody who is
      # not already looking: a migration that aborted the release
      # (release_command, before any traffic), and a rollback that itself
      # failed -- production is then on neither version and no other check
      # runs for up to fifteen minutes.
      #
      # failure() covers every step above, including the rollback.
      - name: Page on a failed deploy
        if: failure()
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.gate.outputs.sha }}
          SMOKE: ${{ steps.smoke.outcome }}
          CANARY: ${{ steps.canary.outcome }}
        run: |
          scripts/notify.sh \
            --title "LEI: deploy failed" --priority 5 --tags rotating_light \
            --click "$RUN_URL" \
            "Deploy of ${SHA:0:7} failed (smoke: ${SMOKE:-not reached}, canary: ${CANARY:-not reached}). If the rollback did not run, production is on the new version. Check /readyz."

      - name: Report deployed version
        if: success()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status -a lowendinsight | head -12
          echo "readyz: $(curl -s --max-time 15 https://lowendinsight.dev/readyz)"
