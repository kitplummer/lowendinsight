name: umbrella_ci

on:
  push:
  pull_request:
    types: [opened]

jobs:
  # Production backups broke when credit_entries was merged: the migration
  # created a table the backup role could not read, and pg_dump failed. The
  # runbook already carried ALTER DEFAULT PRIVILEGES to prevent it, applied for
  # the wrong role.
  #
  # Reproducing that needs a Postgres, two roles and a pg_dump -- nothing from
  # Fly. There is no reason for it to be found in production, so it is checked
  # here against the same schema the application migrates.
  backup-grants:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        elixir-version: 1.16.3
        otp-version: 26.2
    - name: Install dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
    - name: Verify backup grants
      run: scripts/verify-backup-grants.sh

  # LEI library tests — requires Postgres for API key/auth features
  lei-lib:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowendinsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: 1.16.3
        otp-version: 26.2
    - name: Install Dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
    - name: Setup Database
      run: |
        cd apps/lowendinsight && MIX_ENV=test mix ecto.create && MIX_ENV=test mix ecto.migrate
    # This step used to retry up to five times, each attempt with a fresh
    # random seed. That turned a seed-dependent failure into a green check:
    # Lei.Acp.RateLimitTest was failing on roughly two seeds in three and CI
    # never once reported it (#107). A retry loop over a randomised suite does
    # not paper over flakiness, it hides ordering bugs -- which is the same
    # "reports success while broken" failure this project keeps shipping.
    #
    # One run, one seed, no retries. If it fails, it failed.
    - name: Run LEI Library Tests
      run: |
        git config --global --add safe.directory /__w/lowendinsight/lowendinsight
        cd apps/lowendinsight && MIX_ENV=test mix test --exclude network --exclude long

    # Application env and ETS outlive the test that touched them, so a test
    # that fails to clean up breaks a different file -- but only on the
    # orderings where it runs first. A single seed per CI run finds that
    # eventually; several find it now.
    - name: Seed sweep
      run: |
        cd apps/lowendinsight
        failed=""
        for seed in $(shuf -i 1-999999 -n 5); do
          echo "::group::seed $seed"
          if MIX_ENV=test mix test --seed "$seed" --exclude network --exclude long; then
            echo "seed $seed: ok"
          else
            echo "seed $seed: FAILED"
            failed="$failed $seed"
          fi
          echo "::endgroup::"
        done

        if [ -n "$failed" ]; then
          echo "Order-dependent failure on seed(s):$failed"
          echo "Reproduce with: cd apps/lowendinsight && mix test --seed <seed>"
          exit 1
        fi

        echo "Suite is order-independent across 5 seeds."
    - name: Generate Docs
      run: |
        cd apps/lowendinsight && MIX_ENV=dev mix docs
    - name: LowEndInsight Scan
      continue-on-error: true
      run: |
        cd apps/lowendinsight && mix lei.scan ../..

  # LEI-get API tests — requires Postgres + Redis
  lei-get:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowendinsight_get_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: 1.16.3
        otp-version: 26.2
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install Dependencies
      run: |
        npm install -g newman
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
    - name: Setup Database
      run: |
        MIX_ENV=test mix ecto.create
        MIX_ENV=test mix ecto.migrate
    - name: Run LEI-get Tests
      run: cd apps/lowendinsight_get && MIX_ENV=test mix test

  # Verify that guard tests actually catch the bugs they were written for.
  # A green run here means every mutation was caught. The failures are consumed
  # inside the job, so this does not leave a red run in the branch list for
  # someone to explain.
  guard-verification:
    name: Guard verification
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowendinsight_get_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        elixir-version: 1.16.3
        otp-version: 26.2
    - name: Install dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
    - name: Setup database
      run: |
        MIX_ENV=test mix ecto.create
        MIX_ENV=test mix ecto.migrate
    - name: Verify guards
      run: ./scripts/verify-guards.sh
    - name: Confirm the working tree was restored
      run: |
        # The script restores on every exit path via a trap. If it ever fails
        # to, the next job would build deliberately broken code.
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::verify-guards.sh left the working tree modified"
          git status --porcelain
          git diff | head -40
          exit 1
        fi
        echo "Working tree clean."

  # Dependency audit
  audit:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: elixir:1.16.3-alpine

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        apk add git
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
    - name: Run Audit
      run: |
        MIX_ENV=test mix deps.audit
