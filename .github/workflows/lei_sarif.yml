name: lei_sarif_scan

# Runs the published GitHub Action (action.yml at the root) against this
# repository, so every PR exercises the action exactly as a user's workflow
# would: composite steps, the action's own checkout, the SARIF it writes.
#
# The scan used to be run directly with continue-on-error, and crashed on every
# run since at least 2026-10-03 (a lockfileVersion 3 package-lock.json the npm
# parser had no clause for). The upload then skipped for want of a file, and the
# workflow reported success having uploaded nothing. The action fails when it
# cannot write a SARIF log with a run in it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  security-events: write
  actions: read
  contents: read

# A newer commit on a pull request replaces the run for the older one. On main,
# a push waits for the run before it rather than cancelling it.
concurrency:
  group: lei-sarif-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lei-sarif:
    runs-on: ubuntu-24.04
    # About eleven minutes when it scans what we ship. On 2026-10-27 it took up
    # to two hours, with nothing to stop it; one that hangs now fails.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: LowEndInsight (this repository's action)
      id: lei
      uses: ./
      with:
        # The editor extension has no runtime dependencies. Its lockfile is 341
        # dev-only build tools, and analysing them took the scan from eleven
        # minutes to two hours (#331).
        exclude: apps/lei_service/vscode-lowendinsight

    - name: Upload SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.lei.outputs.sarif_file }}
        category: lowendinsight
