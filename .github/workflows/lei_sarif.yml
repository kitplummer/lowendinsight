name: lei_sarif_scan

# The scan used to run with continue-on-error, and crashed on every run since
# at least 2026-10-03 (a lockfileVersion 3 package-lock.json the npm parser had
# no clause for). The upload step then skipped for want of a file, and the
# workflow reported success having uploaded nothing. A scan that cannot finish
# fails here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  lei-sarif:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
    - uses: actions/checkout@v7

    - name: Setup Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: 1.20.4
        otp-version: 28.5.0.6

    - name: Install Dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Run LowEndInsight SARIF Scan
      run: |
        git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
        cd apps/lowendinsight && mix lei.sarif ../.. --output ../../lei-results.sarif

    - name: Upload SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: lei-results.sarif
        category: lowendinsight
