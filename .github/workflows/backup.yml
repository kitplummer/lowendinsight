name: backup

# Verify the backup. Taking it happens elsewhere, on purpose.
#
# A scheduled Fly Machine produces the dump now (ops/backup/), inside the same
# private network as the database. This job checks the result. ADR-006 has the
# reasoning; the short version is that producing it here put a WireGuard
# tunnel, `flyctl proxy`, a flyctl binary resolved as `latest`, the pgdg apt
# repository and a GitHub runner in the nightly path, and three of those have
# failed.
#
# What this job is for, in order of what it actually catches:
#
#   1. The producer stopped. A scheduled Machine that is never scheduled, whose
#      image will not boot, or that someone destroyed, produces no failure
#      anywhere -- no red run, no page, nothing. An object that did not arrive
#      in the last 26 hours does. This is the check that matters most and it is
#      the one the old design could not have.
#   2. The artifact does not decrypt with the passphrase CI holds.
#   3. The dump does not restore. Not "the table of contents parses" -- it is
#      restored into a real PostgreSQL 17 and queried, every run.
#   4. It restored empty. Every check above passes for a dump of nothing.
#
# Fly volume snapshots remain the primary recovery mechanism: daily, 30-day
# retention. This covers what they cannot -- portable to any Postgres including
# the uds-core target (#19), partial recovery of one table, and evidence that
# the data is logically readable rather than block-identical to whatever is on
# the volume, corruption included.
#
# ON BLAST RADIUS -- Tigris is provisioned through Fly and lives in the same
# organisation as the database, so the nightly copy shares a fate with the
# volume snapshots. Two things carry a copy off Fly: the encrypted artifact
# this job uploads on every successful run (90 days), and
# scripts/backup-pull.sh, which puts one on a machine a human controls. The
# second is manual and therefore the one that quietly stops happening; it
# records the date of the last pull in the bucket so that going stale is
# visible rather than assumed.
#
# Required secrets:
#   TIGRIS_READ_ACCESS_KEY_ID      read-only Tigris key -- this job never writes
#   TIGRIS_READ_SECRET_ACCESS_KEY
#   BACKUP_PASSPHRASE              the same passphrase the producer encrypts with
#
# The producer's own secrets (database URL, write-scoped Tigris keys) live on
# the Fly app and are deliberately not here. CI cannot take a backup, cannot
# reach the database, and cannot overwrite an artifact.
#
# KEY MANAGEMENT -- GitHub Actions secrets are write-only. Once BACKUP_PASSPHRASE
# is set it cannot be read back through the UI or API. A passphrase that exists
# only as a CI secret makes every artifact it encrypts permanently unreadable.
# Record it in a password manager BEFORE setting it here, and keep that copy
# somewhere that is neither the hosting account nor this CI provider.
#
# This job decrypts with the CI secret, which cannot detect that the copy in
# your password manager has drifted from it. scripts/backup-pull.sh decrypts
# with your copy, which is why it exists and why "occasional" has to mean
# something. Run it after rotating the passphrase, without exception: a rotated
# key never tested against the copy you keep is the same failure as having no
# backup.
#
# Restore:
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d lei-backup.dump.gpg > lei.dump
#   pg_restore -d <target> lei.dump            # whole database
#   pg_restore -d <target> -t orgs lei.dump    # single table
#
# Full procedure, including volume-snapshot restore and its two gotchas:
#   apps/lei_service/docs/OPERATIONS.md -- "Backup & Recovery"

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refuses to proceed half-configured. A verification that cannot read the
      # bucket must fail, not report a backup it never looked at.
      - name: Check configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_READ_SECRET_ACCESS_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          MISSING=""
          [ -z "$AWS_ACCESS_KEY_ID" ] && MISSING="$MISSING TIGRIS_READ_ACCESS_KEY_ID"
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && MISSING="$MISSING TIGRIS_READ_SECRET_ACCESS_KEY"
          [ -z "$BACKUP_PASSPHRASE" ] && MISSING="$MISSING BACKUP_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING — the backup was not verified."
            exit 1
          fi

      # The check that replaces taking the backup here.
      #
      # The producer is a scheduled Fly Machine now (ops/backup/), so the way
      # it fails is by not running: Fly's scheduler skipping it, the image
      # failing to boot, the machine being destroyed. None of those produce a
      # red anything. An object that did not arrive does.
      #
      # 26 hours, not 24: Fly chooses the minute within the day, so two
      # consecutive runs can be slightly more than 24 hours apart without
      # anything being wrong.
      - name: Fetch the newest backup, and check it is recent
        id: fetch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_READ_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://fly.storage.tigris.dev
          BUCKET: lei-db-backups
        run: |
          S3() { aws --endpoint-url "$AWS_ENDPOINT_URL_S3" "$@"; }

          # meta/latest is written last by the producer, after the object it
          # names is confirmed present, so it never points at a half-written
          # upload. Reading a sorted listing instead would.
          if ! S3 s3 cp "s3://${BUCKET}/meta/latest" latest.txt --only-show-errors; then
            echo "::error::No meta/latest in ${BUCKET}. Either the producer has never run, or it cannot write. Check: flyctl logs -a lowendinsight-backup"
            exit 1
          fi

          KEY=$(tr -d '\r\n' < latest.txt)
          [ -n "$KEY" ] || { echo "::error::meta/latest is empty."; exit 1; }
          echo "newest object: ${KEY}"

          MODIFIED=$(S3 s3api head-object --bucket "$BUCKET" --key "$KEY" \
            --query LastModified --output text 2>/dev/null || true)

          if [ -z "$MODIFIED" ]; then
            echo "::error::meta/latest names ${KEY}, which is not in the bucket."
            exit 1
          fi

          AGE=$(( $(date -u +%s) - $(date -u -d "$MODIFIED" +%s) ))
          echo "age: ${AGE}s (modified ${MODIFIED})"
          echo "age=$AGE" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          LIMIT=$(( 26 * 3600 ))
          if [ "$AGE" -gt "$LIMIT" ]; then
            echo "::error::The newest backup is ${AGE}s old, over the ${LIMIT}s limit. The producer has stopped: nothing has been backed up since ${MODIFIED}. Check: flyctl machine list -a lowendinsight-backup"
            exit 1
          fi

          S3 s3 cp "s3://${BUCKET}/${KEY}" lei-backup.dump.gpg --only-show-errors
          SIZE=$(stat -c%s lei-backup.dump.gpg)
          echo "size: ${SIZE} bytes"

          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::The artifact is only ${SIZE} bytes. It is an object, not a backup."
            exit 1
          fi

      - name: Decrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" > pass
          if ! gpg --batch --yes --passphrase-file pass \
                 --output lei-backup.dump --decrypt lei-backup.dump.gpg; then
            shred -u pass
            echo "::error::The artifact does not decrypt with BACKUP_PASSPHRASE. Either the passphrase was rotated without re-setting it on the producer, or the object is corrupt."
            exit 1
          fi
          shred -u pass

          # Readable, not merely decryptable.
          docker run --rm -v "$PWD:/w" -w /w \
            postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652 \
            pg_restore --list lei-backup.dump > toc.txt
          echo "tables with data: $(grep -c 'TABLE DATA' toc.txt || true)"

      # The check a listing cannot give you.
      #
      # `pg_restore --list` reads the archive's table of contents; it proves the
      # header is intact and says nothing about whether the data restores. This
      # actually restores it into a real PostgreSQL 17 and then counts rows --
      # so "the backup is good" means a database was rebuilt from it in this
      # run, not that a file looked right.
      - name: Restore it into a real database
        run: |
          IMAGE=postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652

          docker run -d --name restore-target \
            -e POSTGRES_PASSWORD=verify -e POSTGRES_DB=restored \
            "$IMAGE" >/dev/null

          for attempt in $(seq 1 30); do
            if docker exec restore-target pg_isready -q -U postgres; then break; fi
            sleep 2
          done
          docker exec restore-target pg_isready -U postgres \
            || { echo "::error::The restore target never became ready."; exit 1; }

          docker cp lei-backup.dump restore-target:/tmp/lei.dump

          # --no-owner/--no-acl: the dump is taken that way, and the roles it
          # references do not exist here. Errors that matter still fail below.
          docker exec restore-target pg_restore --no-owner --no-acl \
            -U postgres -d restored /tmp/lei.dump 2>restore.err || true

          if grep -qi "error" restore.err; then
            echo "::error::pg_restore reported errors restoring the backup:"
            sed 's/^/    /' restore.err | head -20
            exit 1
          fi

          # A restore that produced empty tables is the failure this whole file
          # exists to catch: it would satisfy every check above.
          for t in orgs api_keys analysis_usage credit_entries schema_migrations; do
            COUNT=$(docker exec restore-target psql -U postgres -d restored -tAc \
              "SELECT count(*) FROM public.${t}" 2>/dev/null || echo "missing")
            echo "  ${t}: ${COUNT}"
            if [ "$COUNT" = "missing" ]; then
              echo "::error::Table '${t}' did not restore."
              exit 1
            fi
          done

          # schema_migrations being empty means the schema came from nowhere.
          MIGRATIONS=$(docker exec restore-target psql -U postgres -d restored -tAc \
            "SELECT count(*) FROM public.schema_migrations")
          if [ "${MIGRATIONS:-0}" -lt 1 ]; then
            echo "::error::schema_migrations restored empty, so this dump does not describe a migrated database."
            exit 1
          fi
          echo "Restored and queried: ${MIGRATIONS} migrations present."

      # How long since a copy left Fly for a machine a human controls.
      #
      # A warning rather than a failure, deliberately, and this is the one
      # place in this repository where that is the right answer. The artifact
      # uploaded below already keeps an off-Fly copy on every green run, so
      # durability does not depend on anyone remembering anything. What the
      # local pull uniquely proves is that the passphrase in a password manager
      # still opens these files -- something no check here can establish,
      # because CI decrypts with the CI secret and therefore only ever proves
      # that CI agrees with itself.
      #
      # Failing the nightly backup because a human has not run a script would
      # make this job red for a reason that is not about the backup, and
      # monitor.yml already records what a permanently red check does to the
      # people who are supposed to read it.
      - name: Note how long since a copy left Fly
        if: always() && steps.fetch.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_READ_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://fly.storage.tigris.dev
          BUCKET: lei-db-backups
        run: |
          LAST=$(aws --endpoint-url "$AWS_ENDPOINT_URL_S3" s3 cp \
            "s3://${BUCKET}/meta/last-local-pull" - 2>/dev/null | head -1 || true)

          if [ -z "$LAST" ]; then
            echo "::warning::No copy has ever been pulled off Fly with the stored passphrase. Run: BACKUP_PASSCODE=... ./scripts/backup-pull.sh"
            exit 0
          fi

          WHEN=${LAST%% *}
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$WHEN" +%s) ) / 86400 ))
          echo "last local pull: ${WHEN} (${DAYS} days ago)"

          if [ "$DAYS" -gt 30 ]; then
            echo "::warning::${DAYS} days since a backup was decrypted with the passphrase you keep, rather than the one CI holds. If it has drifted, nothing here would know. Run: ./scripts/backup-pull.sh"
          fi

      - name: Stop the restore target
        if: always()
        run: docker rm -f restore-target >/dev/null 2>&1 || true

      # Tigris is provisioned through Fly and lives in the same organisation as
      # the database, so it shares a blast radius with the volume snapshots.
      # This keeps an encrypted copy outside Fly automatically, which is what
      # this job did before the producer moved, and it costs one upload of a
      # file already downloaded. scripts/backup-pull.sh is the other off-Fly
      # copy, onto a machine a human controls.
      - uses: actions/upload-artifact@v4
        with:
          name: lei-backup-${{ github.run_started_at }}
          path: lei-backup.dump.gpg
          retention-days: 90
          if-no-files-found: error

      # A backup that stops running is the one failure you discover at the
      # moment you need it. Pages at priority 4: urgent to fix today, but
      # nothing is on fire right now -- unlike a failed deploy, which is
      # serving.
      - name: Page on a failed backup
        if: failure()
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGE: ${{ steps.fetch.outputs.age }}
          KEY: ${{ steps.fetch.outputs.key }}
        run: |
          scripts/notify.sh \
            --title "LEI: backup failed" --priority 4 --tags floppy_disk \
            --click "$RUN_URL" \
            "The daily backup could not be verified. Newest object: ${KEY:-none found}, age ${AGE:-unknown}s. Either the producer stopped (flyctl machine list -a lowendinsight-backup) or the artifact does not restore."
