name: backup-trigger

# Start the producer, because Fly's scheduler does not.
#
# The machine was created with `--schedule daily` on 2026-09-26 and recreated on
# 2026-09-27 with `--restart on-failure` -- Fly's own default for a scheduled
# machine. In neither configuration did flyd ever start it: every start event in
# its history reads SOURCE=user, a human forcing one. Two days, three
# configurations, not one scheduled run. ADR-006 inferred that `--restart no`
# was the cause; that theory did not survive `on-failure` failing the same way.
#
# So the schedule lives somewhere observable instead. A workflow either ran or it
# did not, its history is visible, and its failure pages.
#
# THIS DOES NOT TAKE THE BACKUP. ADR-006's separation stands: the dump happens on
# a machine inside Fly's private network, with the database credentials and the
# bucket write key, neither of which is here. This says "run now" and reports
# what happened. If GitHub is down the backup does not happen, which is worse
# than a working scheduler and better than the nothing we had.
#
# Required secret:
#   FLY_BACKUP_TOKEN   a Fly token scoped to the BACKUP app:
#                        flyctl tokens create deploy -a lowendinsight-backup
#                      Deliberately separate from FLY_API_TOKEN and
#                      FLY_DB_TOKEN. This one may start a machine in one app and
#                      nothing else.

on:
  schedule:
    # 02:10 UTC, before backup.yml verifies at 03:30. A trigger that ran after
    # its own verification would leave the check reading the previous day's
    # object and failing on staleness for a day.
    - cron: '10 2 * * *'
  workflow_dispatch:

concurrency:
  group: backup-producer
  cancel-in-progress: false

jobs:
  produce:
    name: Start the producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master @ 2026-09-25
        with:
          version: v0.4.108

      - name: Start it and wait for the result
        id: produce
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKUP_TOKEN }}
          APP: lowendinsight-backup
        # The logic, and why each check is there, is in the script, so it can be
        # run against a stubbed flyctl (backup_trigger_test.exs).
        run: scripts/ops/backup-trigger.sh

      # backup.yml verifies the object independently at 03:30. This pages for the
      # narrower thing: the producer did not run, or ran and failed. Without it,
      # a producer that stopped being started is only noticed by the freshness
      # check a day later.
      - name: Page on a failed backup
        if: failure()
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/notify.sh \
            --title "LEI: backup producer did not run" --priority 4 --tags floppy_disk \
            --click "$RUN_URL" \
            "Starting the nightly dump failed. No new backup was taken; the newest is whatever the last successful run left. Verification at 03:30 will fail on staleness if this is not fixed."
