name: audit

# Dependency advisories, split out of umbrella_ci.
#
# The audit compares the lock file with advisory databases that change on
# their own schedule. Run on every PR, a database update failed unrelated PRs
# and main with no code change -- on 2026-09-16 because an advisory was revised
# to "fixed in the version we lock". So:
#
#   - daily, --strict: a new advisory against a locked dependency fails, and so
#     does an acknowledgement that no longer matches. A failed scheduled run is
#     the alert, as for monitor.yml.
#   - on a PR that changes dependencies or the audit itself: an unacknowledged
#     advisory fails the PR; a stale acknowledgement is only a warning.
#   - on any other PR: the job still runs and passes without auditing. `audit`
#     is a required status check on main, and a check that never reports blocks
#     the merge -- a `paths:` filter on the trigger blocked every PR that did not
#     touch dependencies (#213, 2026-09-17).
#
# scripts/preflight.sh still runs the non-strict audit locally.

on:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Decided per PR from its diff, so the required check always reports.
    - name: Does this change dependencies?
      id: scope
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then
          echo "audit=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
        if [ -z "$CHANGED" ]; then
          # An empty diff here means the comparison failed, not that nothing
          # changed. Audit rather than pass on nothing.
          echo "::warning::Could not list this PR's changes; auditing."
          echo "audit=true" >> "$GITHUB_OUTPUT"
        elif printf '%s\n' "$CHANGED" | grep -qE '(^|/)mix\.(lock|exs)$|^scripts/(acknowledged-advisories\.txt|dependency-audit\.sh)$|^\.github/workflows/audit\.yml$'; then
          echo "audit=true" >> "$GITHUB_OUTPUT"
        else
          echo "audit=false" >> "$GITHUB_OUTPUT"
          echo "No dependency or audit changes; not auditing. The daily --strict run covers new advisories."
        fi
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      if: steps.scope.outputs.audit == 'true'
      with:
        elixir-version: 1.20.4
        otp-version: 28.5.0.6
    - name: Install Dependencies
      if: steps.scope.outputs.audit == 'true'
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
    - name: Hex and mix_audit advisories
      if: steps.scope.outputs.audit == 'true'
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          scripts/dependency-audit.sh
        else
          scripts/dependency-audit.sh --strict
        fi

    # What is published, against what the tree says is published.
    #
    # Sixteen commits sat unreleased from 2026-09-16 to 2026-10-03, including
    # the three modules that are the library's differentiation. Nothing noticed:
    # every other check reads the tree, and the tree was fine. It surfaced only
    # when the published package was consumed from outside the repository, and a
    # survey built on it produced 329 analysed repositories with zero
    # functional_commit_currency_weeks.
    #
    # Two contradictions, both cheap to detect:
    #
    #   * hex has a version the CHANGELOG still calls unreleased
    #   * the tree's version is already published, and the tree has moved since
    #     its tag -- which means the next release has no number allocated, and
    #     that is the state in which commits accumulate unnoticed
    #
    # Here rather than in the suite because it needs the network, and
    # `@tag :network` is excluded everywhere including CI: a guard that never
    # runs is not a guard. On a PR it reports; on the daily run it fails.
    - name: The published version and the tree agree
      if: always()
      shell: bash
      run: |
        set -o pipefail

        VERSION=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' apps/lowendinsight/mix.exs | head -1)
        HEX=$(curl -sf --max-time 30 https://hex.pm/api/packages/lowendinsight \
          | jq -r '.releases[0].version') || HEX=""

        if [ -z "$HEX" ]; then
          echo "::warning::could not read the published version from hex; not concluding anything"
          exit 0
        fi

        echo "tree: $VERSION   hex: $HEX"
        FAILED=0

        # A published version whose section still says unreleased.
        if grep -qiE "^## +${HEX//./\\.} .*unreleased" apps/lowendinsight/CHANGELOG.md; then
          echo "::error::CHANGELOG calls ${HEX} unreleased, but it is published on hex. Give it the date it shipped."
          FAILED=1
        fi

        # The tree's version is already out, and the tree has moved since.
        if [ "$VERSION" = "$HEX" ]; then
          BEHIND=$(git log "v${VERSION}..HEAD" --oneline -- apps/lowendinsight | wc -l | tr -d ' ')

          if [ "$BEHIND" != "0" ]; then
            echo "::error::${BEHIND} commit(s) touch the library since v${VERSION}, which is already published. Bump the version and add a CHANGELOG section, or they ship to nobody."
            FAILED=1
          fi
        fi

        if [ "$FAILED" = "1" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
          exit 1
        fi

        [ "$FAILED" = "1" ] && echo "::warning::reported on a pull request; the daily run fails on this"
        exit 0
