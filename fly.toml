# fly.toml file generated for lowendinsight-get on 2022-11-28T22:03:50-05:00

app = "lowendinsight"
kill_signal = "SIGINT"
# Above Oban's shutdown_grace_period (60s), so a deploy drains running
# analyses instead of killing them. 79 jobs were left executing at 5s.
kill_timeout = 90
processes = []

[build]
  dockerfile = "apps/lei_service/Dockerfile"

# Runs in a temporary machine before the new version takes traffic. If it fails,
# the release is aborted and the current version keeps serving. Migrations had
# previously only ever been applied by hand.
[deploy]
  release_command = "/opt/app/bin/lei_service eval 'LeiService.Release.migrate()'"

[env]
  # Lei.Stripe.Mode refuses a live Stripe key anywhere this is not "production".
  LEI_DEPLOY_ENV = "production"
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  PORT = "8080"
  # git refuses every transport but https, whatever URL reaches it: the
  # service's own check (LeiService.RemoteUrl) is the first line, this
  # is the second, and it also covers redirects to file:// or git://.
  GIT_ALLOW_PROTOCOL = "https"

[experimental]
  allowed_public_ports = []
  auto_rollback = true
  cmd = []
  entrypoint = []
  exec = []
  private_network = true

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # A TCP check only proves the port accepts connections; a wedged app with an
  # open socket looks healthy. /healthz exercises the routing layer, and
  # /readyz additionally checks the database.
  [[services.http_checks]]
    grace_period = "10s"
    interval = "15s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    restart_limit = 3
    timeout = "5s"
    tls_skip_verify = false

  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/readyz"
    protocol = "http"
    restart_limit = 0
    timeout = "10s"
    tls_skip_verify = false
