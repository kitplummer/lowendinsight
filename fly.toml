# fly.toml file generated for lowendinsight-get on 2022-11-28T22:03:50-05:00

app = "lowendinsight"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[build]
  dockerfile = "apps/lowendinsight_get/Dockerfile"

[env]
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  PORT = "8080"

[experimental]
  allowed_public_ports = []
  auto_rollback = true
  cmd = []
  entrypoint = []
  exec = []
  private_network = true

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # A TCP check only proves the port accepts connections; a wedged app with an
  # open socket looks healthy. /healthz exercises the routing layer, and
  # /readyz additionally checks the database.
  [[services.http_checks]]
    grace_period = "10s"
    interval = "15s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    restart_limit = 3
    timeout = "5s"
    tls_skip_verify = false

  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/readyz"
    protocol = "http"
    restart_limit = 0
    timeout = "10s"
    tls_skip_verify = false
